<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CANAL — Chat privé éphémère</title>
<style>
  /* ── Typographie & variables ───────────────────────────── */
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');

  :root {
    --bg:      #f5f4f0;
    --surface: #ffffff;
    --border:  #1a1a1a;
    --ink:     #1a1a1a;
    --muted:   #888;
    --accent:  #1a1a1a;
    --recv:    #e8e8e4;
    --sent:    #1a1a1a;
    --sent-fg: #f5f4f0;
    --error:   #c0392b;
    --sys:     #666;
    --radius:  0px;
    --gap:     1.5rem;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Écran de connexion ────────────────────────────────── */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 2rem;
  }

  .login-box {
    width: 100%;
    max-width: 380px;
    border: 2px solid var(--border);
    background: var(--surface);
    padding: 2.5rem 2rem;
  }

  .login-box h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 0.25rem;
  }

  .login-box .tagline {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 2rem;
    font-family: 'IBM Plex Mono', monospace;
  }

  .login-box label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.5rem;
  }

  .login-box input[type="text"] {
    width: 100%;
    border: 2px solid var(--border);
    background: var(--bg);
    padding: 0.7rem 0.75rem;
    font-size: 1rem;
    font-family: 'IBM Plex Mono', monospace;
    outline: none;
    margin-bottom: 1.25rem;
    color: var(--ink);
  }

  .login-box input[type="text"]:focus {
    background: #fff;
    border-color: var(--border);
    box-shadow: 3px 3px 0 var(--border);
  }

  .btn {
    display: inline-block;
    border: 2px solid var(--border);
    background: var(--accent);
    color: #f5f4f0;
    padding: 0.65rem 1.5rem;
    font-size: 0.8rem;
    font-weight: 600;
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: transform 80ms, box-shadow 80ms;
    width: 100%;
    text-align: center;
  }

  .btn:hover  { box-shadow: 3px 3px 0 #888; transform: translate(-1px,-1px); }
  .btn:active { box-shadow: none; transform: translate(0,0); }

  .btn.secondary {
    background: var(--bg);
    color: var(--ink);
  }

  #login-error {
    margin-top: 0.75rem;
    font-size: 0.8rem;
    color: var(--error);
    font-family: 'IBM Plex Mono', monospace;
    display: none;
  }

  /* ── Layout principal ──────────────────────────────────── */
  #app {
    display: none;
    height: 100vh;
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 48px 1fr;
  }

  /* ── Barre du haut ─────────────────────────────────────── */
  #topbar {
    grid-column: 1 / -1;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 1.25rem;
    background: var(--surface);
    gap: 1.5rem;
  }

  #topbar .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.04em;
  }

  #topbar .you {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  #topbar .you strong { color: var(--ink); }

  #topbar .spacer { flex: 1; }

  #topbar .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #27ae60;
    display: inline-block;
    margin-right: 0.4rem;
  }

  #btn-disconnect {
    font-size: 0.7rem;
    padding: 0.3rem 0.8rem;
    width: auto;
  }

  /* ── Colonne gauche : liste utilisateurs ───────────────── */
  #sidebar {
    border-right: 2px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #sidebar h2 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0.9rem 1rem 0.5rem;
    color: var(--muted);
    border-bottom: 1px solid #e0e0de;
  }

  #user-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 0;
  }

  .user-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.55rem 1rem;
    cursor: pointer;
    font-size: 0.88rem;
    font-family: 'IBM Plex Mono', monospace;
    border-left: 3px solid transparent;
    transition: background 80ms;
    user-select: none;
  }

  .user-item:hover   { background: var(--bg); }
  .user-item.active  { border-left-color: var(--border); background: var(--bg); font-weight: 600; }
  .user-item .dot    { width: 7px; height: 7px; border-radius: 50%; background: #27ae60; flex-shrink: 0; }

  .user-item .unread {
    margin-left: auto;
    background: var(--border);
    color: #fff;
    font-size: 0.65rem;
    padding: 1px 5px;
    border-radius: 2px;
    font-weight: 600;
  }

  .sidebar-empty {
    padding: 1rem;
    font-size: 0.78rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ── Zone de chat ──────────────────────────────────────── */
  #chat-area {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  /* ── Écran d'accueil (aucun destinataire) ──────────────── */
  #chat-welcome {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.75rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    text-align: center;
    padding: 2rem;
  }

  #chat-welcome .arrow { font-size: 2rem; opacity: 0.25; }

  /* ── En-tête conversation ──────────────────────────────── */
  #chat-header {
    display: none;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1.25rem;
    border-bottom: 2px solid var(--border);
    background: var(--surface);
  }

  #chat-header .with {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 0.95rem;
  }

  #chat-header .ephemeral-note {
    font-size: 0.7rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-left: auto;
  }

  /* ── Messages ──────────────────────────────────────────── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    scroll-behavior: smooth;
  }

  .msg {
    max-width: 72%;
    padding: 0.65rem 0.9rem;
    border: 1.5px solid var(--border);
    font-size: 0.88rem;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;   /* ← préserve les retours à la ligne */
  }

  .msg.recv { background: var(--recv); align-self: flex-start; }
  .msg.sent { background: var(--sent); color: var(--sent-fg); align-self: flex-end; border-color: var(--sent); }
  .msg.sys  { background: transparent; border: none; color: var(--sys); font-size: 0.75rem; font-family: 'IBM Plex Mono', monospace; align-self: center; max-width: 100%; padding: 0.2rem 0; }
  .msg.err  { background: #fdf0ef; border-color: var(--error); color: var(--error); font-size: 0.78rem; font-family: 'IBM Plex Mono', monospace; align-self: center; }

  .msg .meta {
    font-size: 0.65rem;
    opacity: 0.55;
    margin-bottom: 0.3rem;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ── Zone de saisie ────────────────────────────────────── */
  #input-area {
    display: none;
    border-top: 2px solid var(--border);
    background: var(--surface);
    padding: 0.9rem 1.25rem;
    gap: 0.75rem;
    flex-direction: column;
  }

  #input-area .hint {
    font-size: 0.68rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  #message-input {
    width: 100%;
    min-height: 100px;
    max-height: 300px;
    resize: vertical;
    border: 2px solid var(--border);
    background: var(--bg);
    padding: 0.7rem 0.75rem;
    font-size: 0.9rem;
    font-family: 'IBM Plex Mono', monospace;
    outline: none;
    color: var(--ink);
    line-height: 1.5;
  }

  #message-input:focus { background: #fff; box-shadow: 3px 3px 0 #aaa; }

  .input-row {
    display: flex;
    gap: 0.6rem;
    align-items: center;
  }

  .input-row .btn { width: auto; }

  #char-count {
    font-size: 0.68rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-left: auto;
  }

  /* ── Scrollbar discrète ────────────────────────────────── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

  /* ── Responsive (petit écran) ──────────────────────────── */
  @media (max-width: 600px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 48px auto 1fr; }
    #sidebar { grid-row: 2; max-height: 140px; border-right: none; border-bottom: 2px solid var(--border); }
    #chat-area { grid-row: 3; }
    .msg { max-width: 90%; }
  }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
     ÉCRAN DE CONNEXION
══════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-box">
    <h1>CANAL</h1>
    <p class="tagline">// chat privé · éphémère · sans trace</p>

    <label for="pseudo-input">Choisissez un pseudo</label>
    <input type="text" id="pseudo-input" placeholder="ex: alice" maxlength="32" autocomplete="off" spellcheck="false">

    <button class="btn" id="btn-connect">Se connecter</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     APPLICATION
══════════════════════════════════════════ -->
<div id="app" style="display:none">

  <!-- Barre du haut -->
  <div id="topbar">
    <span class="logo">CANAL</span>
    <span class="you">connecté en tant que <strong id="topbar-pseudo">—</strong></span>
    <span class="spacer"></span>
    <span><span class="status-dot"></span></span>
    <button class="btn secondary" id="btn-disconnect">Déconnecter</button>
  </div>

  <!-- Sidebar : liste utilisateurs -->
  <div id="sidebar">
    <h2>En ligne</h2>
    <div id="user-list">
      <p class="sidebar-empty">Personne d'autre…</p>
    </div>
  </div>

  <!-- Zone de chat -->
  <div id="chat-area">

    <div id="chat-welcome">
      <div class="arrow">←</div>
      <div>Sélectionnez un utilisateur<br>pour démarrer une conversation privée.</div>
    </div>

    <div id="chat-header">
      <span class="dot" style="width:7px;height:7px;border-radius:50%;background:#27ae60;display:inline-block;"></span>
      <span class="with" id="chat-with-name">—</span>
      <span class="ephemeral-note">messages non sauvegardés</span>
    </div>

    <div id="messages"></div>

    <div id="input-area">
      <span class="hint">Ctrl+Entrée pour envoyer · Vous pouvez coller de très longs textes</span>
      <textarea id="message-input" placeholder="Écrivez ici… Ctrl+V pour coller, Ctrl+Entrée pour envoyer."></textarea>
      <div class="input-row">
        <button class="btn" id="btn-send">Envoyer</button>
        <span id="char-count">0 caractères</span>
      </div>
    </div>

  </div>
</div>

<!-- ══════════════════════════════════════════
     SCRIPT
══════════════════════════════════════════ -->
<script>
(function() {
  "use strict";

  // ── État ─────────────────────────────────────────────────
  let ws = null;
  let myPseudo = "";
  let activePeer = null;
  // { peer: [{ from, text, sent, ts }] }
  const conversations = {};
  // { peer: count }
  const unread = {};

  // ── Éléments DOM ─────────────────────────────────────────
  const loginScreen   = document.getElementById("login-screen");
  const appEl         = document.getElementById("app");
  const pseudoInput   = document.getElementById("pseudo-input");
  const loginError    = document.getElementById("login-error");
  const btnConnect    = document.getElementById("btn-connect");
  const btnDisconnect = document.getElementById("btn-disconnect");
  const topbarPseudo  = document.getElementById("topbar-pseudo");
  const userList      = document.getElementById("user-list");
  const chatWelcome   = document.getElementById("chat-welcome");
  const chatHeader    = document.getElementById("chat-header");
  const chatWithName  = document.getElementById("chat-with-name");
  const messagesEl    = document.getElementById("messages");
  const inputArea     = document.getElementById("input-area");
  const msgInput      = document.getElementById("message-input");
  const btnSend       = document.getElementById("btn-send");
  const charCount     = document.getElementById("char-count");

  // ── Connexion ─────────────────────────────────────────────
  function connect(pseudo) {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const url   = `${proto}://${location.host}/ws/${encodeURIComponent(pseudo)}`;
    ws = new WebSocket(url);

    ws.onopen = () => {
      myPseudo = pseudo;
      loginScreen.style.display = "none";
      appEl.style.display = "grid";
      topbarPseudo.textContent = pseudo;
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      handleMessage(data);
    };

    ws.onerror = () => showLoginError("Impossible de se connecter au serveur.");

    ws.onclose = () => {
      if (appEl.style.display !== "none") {
        disconnect(true);
      }
    };
  }

  function disconnect(unexpected = false) {
    if (ws) { ws.close(); ws = null; }
    myPseudo = "";
    activePeer = null;
    Object.keys(conversations).forEach(k => delete conversations[k]);
    Object.keys(unread).forEach(k => delete unread[k]);
    appEl.style.display = "none";
    loginScreen.style.display = "flex";
    if (unexpected) showLoginError("Connexion interrompue. Reconnectez-vous.");
  }

  // ── Messages entrants ─────────────────────────────────────
  function handleMessage(data) {
    switch (data.type) {

      case "user_list":
        renderUserList(data.users);
        break;

      case "system":
        if (activePeer) appendMsg("sys", null, data.message);
        break;

      case "error":
        if (data.message.includes("pseudo")) {
          disconnect();
          showLoginError(data.message);
        } else {
          appendMsg("err", null, "⚠ " + data.message);
        }
        break;

      case "message": {
        // Message reçu d'un pair
        const peer = data.from;
        if (!conversations[peer]) conversations[peer] = [];
        conversations[peer].push({ from: peer, text: data.text, sent: false, ts: now() });
        if (activePeer === peer) {
          appendMsg("recv", peer, data.text);
        } else {
          unread[peer] = (unread[peer] || 0) + 1;
          renderUserList(Object.keys(conversations).concat(
            Array.from(document.querySelectorAll(".user-item")).map(el => el.dataset.pseudo)
          ).filter((v,i,a) => a.indexOf(v) === i));
          // Déclenche re-render de la liste
          refreshUserList();
        }
        break;
      }

      case "message_sent": {
        // Copie de ce qu'on a envoyé
        const peer = data.to;
        if (!conversations[peer]) conversations[peer] = [];
        conversations[peer].push({ from: myPseudo, text: data.text, sent: true, ts: now() });
        if (activePeer === peer) {
          appendMsg("sent", null, data.text);
        }
        break;
      }
    }
  }

  // ── Envoi de message ──────────────────────────────────────
  function sendMessage() {
    const text = msgInput.value;
    if (!text.trim() || !activePeer || !ws) return;

    ws.send(JSON.stringify({
      type: "private",
      to:   activePeer,
      text: text
    }));

    msgInput.value = "";
    charCount.textContent = "0 caractères";
    msgInput.focus();
  }

  // ── Rendu liste utilisateurs ─────────────────────────────
  let _lastUserList = [];

  function renderUserList(users) {
    _lastUserList = users;
    refreshUserList();
  }

  function refreshUserList() {
    const others = _lastUserList.filter(u => u !== myPseudo);
    userList.innerHTML = "";

    if (others.length === 0) {
      userList.innerHTML = '<p class="sidebar-empty">Personne d\'autre…</p>';
      return;
    }

    others.forEach(pseudo => {
      const el = document.createElement("div");
      el.className = "user-item" + (pseudo === activePeer ? " active" : "");
      el.dataset.pseudo = pseudo;

      const dot = document.createElement("span");
      dot.className = "dot";

      const name = document.createElement("span");
      name.textContent = pseudo;

      el.appendChild(dot);
      el.appendChild(name);

      if (unread[pseudo]) {
        const badge = document.createElement("span");
        badge.className = "unread";
        badge.textContent = unread[pseudo] > 99 ? "99+" : unread[pseudo];
        el.appendChild(badge);
      }

      el.addEventListener("click", () => openConversation(pseudo));
      userList.appendChild(el);
    });
  }

  function openConversation(peer) {
    activePeer = peer;
    delete unread[peer];
    chatWithName.textContent = peer;

    chatWelcome.style.display = "none";
    chatHeader.style.display  = "flex";
    inputArea.style.display   = "flex";
    messagesEl.innerHTML      = "";

    // Rejouer l'historique local
    const history = conversations[peer] || [];
    history.forEach(m => {
      if (m.sent) appendMsg("sent", null, m.text, m.ts);
      else        appendMsg("recv", m.from, m.text, m.ts);
    });

    refreshUserList();
    msgInput.focus();
    scrollBottom();
  }

  // ── Affichage d'un message ────────────────────────────────
  function appendMsg(type, from, text, ts = null) {
    const div = document.createElement("div");
    div.className = "msg " + type;

    if (type === "recv" && from) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = from + (ts ? " · " + ts : "");
      div.appendChild(meta);
    }

    const body = document.createElement("div");
    body.textContent = text;
    div.appendChild(body);

    messagesEl.appendChild(div);
    scrollBottom();
  }

  function scrollBottom() {
    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  function now() {
    return new Date().toLocaleTimeString("fr-CA", { hour: "2-digit", minute: "2-digit" });
  }

  // ── Erreur login ──────────────────────────────────────────
  function showLoginError(msg) {
    loginError.textContent = msg;
    loginError.style.display = "block";
  }

  // ── Événements ────────────────────────────────────────────
  btnConnect.addEventListener("click", () => {
    const p = pseudoInput.value.trim();
    if (!p) { showLoginError("Entrez un pseudo."); return; }
    loginError.style.display = "none";
    connect(p);
  });

  pseudoInput.addEventListener("keydown", e => {
    if (e.key === "Enter") btnConnect.click();
  });

  btnDisconnect.addEventListener("click", () => disconnect());

  btnSend.addEventListener("click", sendMessage);

  msgInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.ctrlKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  msgInput.addEventListener("input", () => {
    const n = msgInput.value.length;
    const lines = msgInput.value.split("\n").length;
    charCount.textContent = `${n.toLocaleString()} caractères · ${lines} lignes`;
  });

})();
</script>

</body>
</html>
